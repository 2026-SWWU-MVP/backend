plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.smwu'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    runtimeOnly 'org.postgresql:postgresql'
    // PostgreSQL 없이 실행할 때 (SPRING_PROFILES_ACTIVE=h2), 테스트 DB
    runtimeOnly 'com.h2database:h2'

    // 비밀번호 해싱 (BCrypt만 사용, Spring Security 아님)
    implementation 'org.springframework.security:spring-security-crypto'

    // 시험범위 PDF 텍스트 추출 / 시험지 PDF 출력
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    implementation 'io.github.openhtmltopdf:openhtmltopdf-pdfbox:1.1.87'

    // API 문서 (Swagger UI)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

// 일반 테스트: Mock LLM만 사용. 실제 API를 부르는 @Tag("llm") 테스트는 제외 (비용 방지)
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'llm'
    }
}

// 실제 LLM API를 호출하는 테스트 (비용 발생). .env의 LLM_API_KEY, LLM_MODEL을 환경변수로 넘긴다
//   ./gradlew llmTest                                  → 스모크 테스트 + 기출 추출 실험
//   ./gradlew llmTest --tests '*ExtractionExperiment'  → 기출 추출 실험만
tasks.register('llmTest', Test) {
    description = '실제 LLM API를 호출하는 테스트 (비용 발생, .env 필요)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'llm'
    }
    outputs.upToDateWhen { false }
    testLogging {
        showStandardStreams = true
    }

    def envFile = file('.env')
    if (envFile.exists()) {
        envFile.readLines('UTF-8')
                .collect { it.trim() }
                .findAll { it && !it.startsWith('#') && it.contains('=') }
                .each { line ->
                    def (key, value) = [line.substring(0, line.indexOf('=')).trim(), line.substring(line.indexOf('=') + 1).trim()]
                    if (value) {
                        environment key, value
                    }
                }
    }
}
