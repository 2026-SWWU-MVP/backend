# PostgreSQL 없이 로컬 실행 (SPRING_PROFILES_ACTIVE=h2). 임시용, 운영은 PostgreSQL
# 파일 DB라 재시작해도 데이터가 남는다. 비우려면 서버를 끄고 storage/h2 폴더를 지운다
spring.datasource.url=jdbc:h2:file:./storage/h2/swmvp;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
