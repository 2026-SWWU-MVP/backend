spring.application.name=backend

# 프로젝트 루트의 .env(커밋 금지)에 있는 값을 읽는다. 없으면 무시. 형식은 .env.example 참고
spring.config.import=optional:file:.env[.properties]

# DB (로컬 PostgreSQL, 환경변수로 덮어쓸 수 있음)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/swmvp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# 파일 업로드
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# 업로드 파일 저장 경로 (기출, 시험범위 자료, 로고)
app.storage.root=${STORAGE_ROOT:./storage}

# 프론트 로컬 주소 (CORS)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# LLM (API 키는 환경변수로만 주입, 커밋 금지)
# provider: mock(기본값, LLM 비용 없이 고정 응답) / openai(실제 호출, API 키와 모델 필요)
app.llm.provider=${LLM_PROVIDER:mock}
app.llm.api-key=${LLM_API_KEY:}
app.llm.model=${LLM_MODEL:}
app.llm.base-url=${LLM_BASE_URL:https://api.openai.com/v1}
app.llm.timeout-seconds=${LLM_TIMEOUT_SECONDS:180}
